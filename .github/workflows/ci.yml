name: CI

# On every PR and push to main. Renovate auto-merges dependency updates only
# when these pass (KeesTucker/renovate-config).
#
# The test suites stay local: the Playwright fixtures encode AAC audio, which
# the runner's Chrome can't, and the Dart tests drive the native engine. So CI
# checks what runs anywhere: the web build and the Dart analyzer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party actions pinned by commit: they run with the job's token.
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dart:
    name: dart (analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
